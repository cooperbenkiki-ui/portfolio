    <style>
        /* Custom Flexbox Gallery row height dynamics */
        .gallery-flex-item {
            height: 320px;
            flex-grow: 1;
            margin: 6px;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background-color: #f3f4f6;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            border: 2px solid transparent;
        }

        @media (max-width: 640px) {
            .gallery-flex-item {
                height: 220px;
                margin: 4px;
            }
        }

        .gallery-flex-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            vertical-align: middle;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .gallery-flex-item:hover {
            border-color: #111115;
        }

        .gallery-flex-item:hover img {
            transform: scale(1.05);
        }

        /* Overlay reveal on hover */
        .gallery-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .gallery-flex-item:hover .gallery-overlay {
            opacity: 1;
        }

        /* View transition animation */
        .view-pane {
            display: none;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .view-pane.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Hide scrollbars for crisp modal viewing */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <!-- MAIN CONTENT WRAPPER -->

    <!-- ========================================== -->
    <!-- LIGHTBOX MODAL OVERLAY (Focus Image)       -->
    <!-- ========================================== -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4 sm:p-8">
        
        <!-- Lightbox Close Button -->
        <button onclick="closeLightbox()" aria-label="Close Lightbox" class="absolute top-4 right-4 sm:top-6 sm:right-6 z-50 text-white/70 hover:text-white w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center backdrop-blur-md transition-all">
            <i class="fa-solid fa-xmark text-xl"></i>
        </button>

        <!-- Previous Image Button -->
        <button onclick="navigateLightbox(-1)" aria-label="Previous Image" class="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-50 text-white/70 hover:text-white w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center backdrop-blur-md transition-all">
            <i class="fa-solid fa-chevron-left text-lg"></i>
        </button>

        <!-- Next Image Button -->
        <button onclick="navigateLightbox(1)" aria-label="Next Image" class="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-50 text-white/70 hover:text-white w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center backdrop-blur-md transition-all">
            <i class="fa-solid fa-chevron-right text-lg"></i>
        </button>

        <!-- Modal Center Stage Container -->
        <div class="relative max-w-6xl w-full max-h-[88vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            
            <!-- Focused Image Container -->
            <div class="relative max-h-[75vh] max-w-full overflow-hidden rounded-lg shadow-2xl flex items-center justify-center">
                <img id="lightbox-img" src="" alt="Expanded View" class="max-h-[75vh] w-auto max-w-full object-contain select-none transition-transform duration-300">
            </div>

            <!-- Image Title & Spec Bar (Descriptions Removed) -->
            <div class="mt-4 text-center max-w-2xl px-4">
                <h3 id="lightbox-title" class="text-xl sm:text-2xl font-sans text-white font-medium mt-2"></h3>
                <div class="text-[11px] font-mono text-gray-400 mt-2 flex items-center justify-center gap-4">
                    <span id="lightbox-counter">1 / 16</span>
                    <span>•</span>
                    <span id="lightbox-specs">Graphic Design & Typography</span>

            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT LOGIC & GALLERY ENGINE          -->
    <!-- ========================================== -->
    <script>
        // Gallery Dataset without description fields
        const galleryItems = [
           
            {

            },
            {

            },
            {

                height: 576,
                src: `Card.png`,
                specs: `Print & Identity`
            },
            {
                id: 7,
                title: `Herb Lubalin Editorial Spread`,
                width: 646,
                height: 1000,
                src: `Lubalin.png`,
                specs: `Editorial & Publication Design`
            },
            {
                id: 8,
                title: `Smak — Swedish Restaurant Chain Logo`,
                width: 1024,
                height: 683,
                src: `Smak.png`,
                specs: `Brand Identity & Custom Lettering`
            },
             {
                id: 9,
                title: `Smak Packaging Mockup`,
                width: 1024,
                height: 730,
                src: `Bag.png`,
                specs: `Packaging & Brand Identity`
            },
                   {
                id: 10,
                title: `Save the Elephants Infographic`,
                width: 667,
                height: 1000,
                src: `Elephant.png`,
                specs: `Information & Advocacy Design`
            },
            {
                id: 11,
                title: `Idiom Illustration`,
                width: 750,
                height: 1000,
                src: `Anvil.png`,
                specs: `Digital Illustration & Concept Art`
            },
            {
                id: 12,
                title: `The Kite Runner Book Cover`,
                width: 680,
                height: 1000,
                src: `Book.png`,
                specs: `Book Cover & Editorial Design`
            },
            {
                id: 13,
                title: `Munchy Time Dog Food Packaging`,
                width: 550,
                height: 1000,
                src: `Dog.png`,
                specs: `Packaging & Product Design`
            },
            {
                id: 14,
                title: `House Keeper — Welcome UI`,
                desc: 'There is',
                width: 460,
                height: 1000,
                src: `Home.png`,
                specs: `UI/UX & Mobile App Design`
            },
            {
                id: 15,
                title: `House Keeper — Login UI`,
                width: 460,
                height: 1000,
                src: `Log.png`,
                specs: `UI/UX & Mobile App Design`
            },
            {
                id: 16,
                title: `Paris 2024 Olympic Archery Poster`,
                width: 750,
                height: 1000,
                src: `Olympics.png`,
                specs: `Poster & Graphic Design`
            }
        ];

        let currentLightboxIndex = 0;

        // Init on Window Load
        window.onload = function() {
            // Read URL hash or default to 'work'
            const hash = window.location.hash.replace('#', '') || 'work';
            navigateTo(hash);
            renderGallery();

            // Set up keyboard event listeners for Lightbox
            document.addEventListener('keydown', handleKeyPress);

            // Lightbox click outside listener
            document.getElementById('lightbox-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeLightbox();
                }
            });
        };

        // Single Page Navigation Function
        function navigateTo(viewId) {
            const validViews = ['work', 'about', 'contact'];
            if (!validViews.includes(viewId)) viewId = 'work';

            // Hide all view panes
            document.querySelectorAll('.view-pane').forEach(pane => {
                pane.classList.remove('active');
            });

            // Show selected view pane
            const targetPane = document.getElementById(`view-${viewId}`);
            if (targetPane) {
                targetPane.classList.add('active');
            }

            // Update Navigation Menu Active Links
            document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-white', 'hover:bg-gray-800');
                btn.classList.add('text-gray-600');
            });

            const activeNav = document.getElementById(`nav-${viewId}`);
            if (activeNav) {
                activeNav.classList.remove('text-gray-600');
                activeNav.classList.add('bg-black', 'text-white');
            }

            // Scroll top smoothly
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Toggle Mobile Menu Drawer
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                icon.className = 'fa-solid fa-xmark text-xl';
            } else {
                menu.classList.add('hidden');
                icon.className = 'fa-solid fa-bars text-xl';
            }
        }

        // Render Adaptive Flexbox Gallery (No description text displayed)
        function renderGallery() {
            const container = document.getElementById('gallery-container');
            container.innerHTML = '';

            galleryItems.forEach((item, index) => {
                const aspectRatio = (item.width / item.height).toFixed(3);
                
                const card = document.createElement('div');
                card.className = 'gallery-flex-item cursor-pointer group';
                card.style.flexGrow = aspectRatio;
                card.style.flexBasis = `${Math.round(280 * aspectRatio)}px`;

                card.innerHTML = `
                    <img 
                        src="${item.src}" 
                        alt="${item.title}" 
                        loading="lazy" 
                        onerror="this.onerror=null; this.src='https://placehold.co/800x600/e2e8f0/64748b?text=${encodeURIComponent(item.title)}';"
                    />
                    <div class="gallery-overlay absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent p-5 flex flex-col justify-between text-white pointer-events-none">
                        <div class="flex justify-end items-start">
                            <span class="w-8 h-8 rounded-full bg-black/40 backdrop-blur-sm border border-white/20 flex items-center justify-center text-xs">
                                <i class="fa-solid fa-expand"></i>
                            </span>
                        </div>
                        <div>
                            <h3 class="text-lg font-sans font-semibold leading-snug">${item.title}</h3>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openLightbox(index));
                container.appendChild(card);
            });
        }

        // ==========================================
        // LIGHTBOX MODAL FUNCTIONS
        // ==========================================
        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightboxContent();

            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('opacity-100');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            currentLightboxIndex += direction;
            if (currentLightboxIndex < 0) {
                currentLightboxIndex = galleryItems.length - 1;
            } else if (currentLightboxIndex >= galleryItems.length) {
                currentLightboxIndex = 0;
            }
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const item = galleryItems[currentLightboxIndex];
            if (!item) return;

            const img = document.getElementById('lightbox-img');
            img.style.transform = 'scale(0.96)';
            
            setTimeout(() => {
                img.src = item.src;
                document.getElementById('lightbox-title').innerText = item.title;
                document.getElementById('lightbox-specs').innerText = item.specs;
                document.getElementById('lightbox-counter').innerText = `${currentLightboxIndex + 1} / ${galleryItems.length}`;
                img.style.transform = 'scale(1)';
            }, 100);
        }

        function handleKeyPress(e) {
            const modal = document.getElementById('lightbox-modal');
            if (modal.classList.contains('opacity-100')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
            }
        }

        // ==========================================
        // CONTACT FORM INTERACTION
        // ==========================================
        function handleFormSubmit(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <i class="fa-solid fa-spinner animate-spin text-sm"></i>
                <span>Sending...</span>
            `;

            setTimeout(() => {
                document.getElementById('contact-form').reset();
                document.getElementById('contact-form').classList.add('hidden');
                document.getElementById('form-success').classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span>Send Message</span>
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                `;
            }, 1200);
        }

        function resetContactForm() {
            document.getElementById('form-success').classList.add('hidden');
            document.getElementById('contact-form').classList.remove('hidden');
        }
    </script>
</body>
</html>
